name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Deployment tag
        required: true
        type: choice
        default: dev
        options: [dev, main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest

    concurrency:
      group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    env:
      NIX_BUILD_SHELL: /bin/bash
      SENTRY_RELEASE: ${{ github.sha }}
      TAG: ${{ inputs.tag || 'dev' }}
      UV_LOCKED: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false

      - name: Lint, type-check and test
        run: |
          nix-shell --pure --keep UV_LOCKED --run '
            set -euo pipefail
            ruff check .
            ruff format --check .
            ty check
            nixfmt --check *.nix
            actionlint
            zizmor .github
            uv run pytest --showlocals --junitxml=test-results.xml
          '

      - name: Build and smoke-test the release image
        run: |
          # shellcheck disable=SC2016
          nix-shell --pure --keep SENTRY_RELEASE --keep TAG --keep UV_LOCKED --run '
            set -euo pipefail
            UV_PROJECT_ENVIRONMENT=.venv-runtime uv sync --no-default-groups
            streamer=$(nix-build --no-out-link)
            "$streamer" > backend.tar
          '
          docker load < backend.tar
          docker run --rm --entrypoint python \
            -v "$PWD/scripts:/checks:ro" "backend:$TAG" /checks/smoke_image.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: backend-image
          path: backend.tar
          if-no-files-found: error

      - uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        if: ${{ !cancelled() && hashFiles('test-results.xml') != '' }}
        with:
          paths: test-results.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && hashFiles('test-results.xml') != '' }}
        with:
          name: test-results
          path: test-results.xml

  deploy:
    name: Deploy tested image
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    concurrency:
      group: deploy-${{ inputs.tag || 'dev' }}
      cancel-in-progress: false

    env:
      TAG: ${{ inputs.tag || 'dev' }}
      RELEASE: ${{ github.sha }}

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-image
          digest-mismatch: error

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host remote
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/id
            ControlMaster auto
            ControlPersist 60
            ControlPath ~/.ssh/control-%C
          EOF

      - name: Load and deploy the verified image
        run: |
          ssh remote 'docker load' < backend.tar
          ssh remote bash -s -- "$TAG" "$RELEASE" <<'EOF'
          set -euo pipefail
          export TAG=$1
          release=$2
          cd "$TAG"
          git fetch origin "$release"
          git reset --hard FETCH_HEAD
          docker compose --env-file "envs/compose/$TAG.env" down --remove-orphans
          docker compose --env-file "envs/compose/$TAG.env" up -d
          EOF

      - name: Close SSH connection
        if: ${{ always() }}
        run: ssh -O exit remote || true
